<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="sudo4 的个人博客，记录后端工程、系统实践与那些值得被写下来的思考。"
    />
    <meta name="author" content="sudo4" />
    <meta name="theme-color" id="theme-color" content="#f4f7f6" />
    <title>sudo4 · 在终端之外记录</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('sudo4-theme')
          const dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#080d0c' : '#f4f7f6')
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
