[package]
name = "sudo4-api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "migrate", "derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
