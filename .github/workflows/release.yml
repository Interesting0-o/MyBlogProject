name: Build release artifacts

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build backend
        working-directory: backend
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --locked

      - name: Package artifacts
        run: |
          set -euo pipefail
          package_name="sudo4-linux-x86_64"
          mkdir -p "release/${package_name}"
          strip "backend/target/release/sudo4-api"
          install -m 0755 "backend/target/release/sudo4-api" "release/${package_name}/sudo4-api"
          cp -R "frontend/dist" "release/${package_name}/dist"
          cp ".env.example" "release/${package_name}/.env.example"
          tar -C release -czf "release/${package_name}.tar.gz" "${package_name}"
          (cd release && sha256sum "${package_name}.tar.gz" > SHA256SUMS)

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automated build from `${{ github.sha }}`.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            release/sudo4-linux-x86_64.tar.gz
            release/SHA256SUMS

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/sudo4-linux-x86_64.tar.gz
            release/SHA256SUMS
